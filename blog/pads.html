        <pre>Date: September 29, 2026
Subject: Blue Exam Pads

I found an old stack of blue exam pads in the bottom of the school storeroom yesterday while looking for spare protractors. Flipping through them brought back the cramp in my right index finger from grading fifty papers in one sitting.

We forget that learning isn't just a mental exercise floating in the clouds. When we write by hand, our fingers command nearly a third of the brain's motor strip, mapping curves and angles into memory with physical precision. Every letter is a tiny physical path.

Typing on a glass screen or a plastic keyboard is efficient, sure, but it flattens all that rich motor territory down to identical little taps of four millimeters. We save time, but we starve the circuit.

Sometimes I make my matric science class write out their derivations on paper instead of punching buttons, and you can practically watch the gears lock into place in their heads. The hand remembers what the screen scrolls right past.
