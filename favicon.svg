<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- MS-DOS Logo inspired pixel/chunky style -->
  <rect width="64" height="64" fill="#0000aa"/>
  <rect x="4" y="4" width="56" height="56" fill="none" stroke="#ffff55" stroke-width="4"/>
  
  <!-- M S - D O S chunky letters -->
  <text x="8" y="24" font-family="monospace" font-weight="900" font-size="20" fill="#aaaaaa">MS</text>
  <text x="8" y="48" font-family="monospace" font-weight="900" font-size="22" fill="#ff0000">D</text>
  <text x="26" y="48" font-family="monospace" font-weight="900" font-size="22" fill="#00ffff">O</text>
  <text x="42" y="48" font-family="monospace" font-weight="900" font-size="22" fill="#ffff55">S</text>
</svg>
