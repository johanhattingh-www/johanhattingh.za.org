        <pre>Date: September 22, 2026
Subject: The Morning Wire

At thirty my body forgave the morning. Coffee on an empty stomach, no breakfast, and nothing asked anything back.

That forgiveness was never a virtue. It was margin. The vagus nerve carried the signals, and a glass of cold water on an empty stomach produced a reflex that ran itself before I was properly awake. The cold receptor doing the sensing rebuilds itself every few days. It works as well at sixty-five as it did at thirty. The nerve underneath it does not. Vagal tone slips about one percent a year after thirty, and the reflex fades with it.

The same arrangement sits behind your eyes. Buried in the retina, behind the rods and cones, another set of cells reads blue morning light and sets every clock in the body. Those cells don't age either. The lens in front of them does. It yellows slowly across decades, filtering out the exact wavelength those cells are built to catch. Perfect sensor, fogged window.

The old Isuzu's starter has caught on the second try for years, worn rather than broken.

Liesl hands me cold water before the coffee now, and I take it to the front step while the kettle boils.

The morning never changed. The wire did.
</pre>
