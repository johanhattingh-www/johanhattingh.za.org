<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MS-DOS v3.30 Retro Terminal & Blog - www.johanhattingh.za.org</title>
    <meta name="description" content="Explore a vintage MS-DOS 3.30 retro terminal web application featuring command-line blog entries, retro text games like The Hobbit, and computing reflections.">
    <meta name="keywords" content="MS-DOS, Retro Terminal, Blog, Command Line, The Hobbit, JavaScript, HTML5, Johan Hattingh">
    <meta name="author" content="Johan Hattingh">
    <link rel="canonical" href="https://www.johanhattingh.za.org/">
    
    <!-- Open Graph / Social SEO -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://www.johanhattingh.za.org/">
    <meta property="og:title" content="MS-DOS v3.30 Retro Terminal & Blog">
    <meta property="og:description" content="An authentic 1980s MS-DOS 3.30 terminal running in your browser with command-line blog posts and retro text games.">
    
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
</head>
<body class="mode-co80">
    <div class="monitor-casing">
        <div class="monitor-brand">IBM Personal Computer XT / MS-DOS v3.30</div>
        <div class="monitor-bezel">
            <div class="crt-overlay"></div>
            <div id="terminal" class="terminal">
                <div id="screen" class="screen">
                    <div id="output"></div>
                    <div id="prompt-line" class="prompt-line">
                        <span id="prompt-text">C:\&gt;</span><span id="command-input" contenteditable="true" spellcheck="false"></span><span class="cursor">_</span>
                    </div>
                </div>
            </div>
        </div>
        <div class="monitor-panel">
            <div class="power-led"></div>
            <span class="power-label">POWER</span>
        </div>
    </div>
    <script src="dos.js"></script>
</body>
</html>
