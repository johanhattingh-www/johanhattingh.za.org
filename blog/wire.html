<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Blog Entry - Johan Hattingh</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../style.css">
    <style>
        body { background: #000; color: #00ff00; font-family: 'Courier New', monospace; padding: 2rem; max-width: 800px; margin: auto; line-height: 1.6; }
        a { color: #ffff00; text-decoration: underline; }
        .banner { border: 1px dashed #00ff00; padding: 1rem; margin-bottom: 2rem; background: #001100; }
    </style>
</head>
<body>
    <div class="banner">
        [SEARCH ENGINE ARRIVAL] Looking for the full retro MS-DOS experience?<br>
        👉 <a href="/?cmd=TYPE+WIRE.TXT">Open this entry in the MS-DOS 3.30 Terminal</a>
    </div>
    <pre id="content">Loading...</pre>
    <script>
        fetch('wire.txt')
            .then(res => res.text())
            .then(text => { document.getElementById('content').textContent = text; });
    </script>
</body>
</html>
