<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Classic MS-DOS blue screen background with white/yellow box border -->
  <rect width="32" height="32" fill="#0000aa"/>
  <rect x="2" y="2" width="28" height="28" fill="none" stroke="#ffff55" stroke-width="2"/>
  
  <!-- Terminal Prompt C:> -->
  <text x="5" y="15" fill="#ffffff" font-family="monospace" font-size="11" font-weight="bold">C:&gt;</text>
  <text x="5" y="25" fill="#55ffff" font-family="monospace" font-size="10">DIR</text>
</svg>
